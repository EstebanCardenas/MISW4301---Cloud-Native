---
# DB service
apiVersion: v1
kind: Service
metadata:
  name: dann-db-service
spec:
  type: ClusterIP
  selector:
    app: dann-db
  ports:
    - protocol: TCP
      port: 5432
      targetPort: 5432

---
# DB deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dann-db-deployment
  labels:
    app: dann-db
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dann-db
  template:
    metadata:
      labels:
        app: dann-db
    spec:
      containers:
        - name: postgres-db
          image: postgres:16
          ports:
          - containerPort: 5432
          volumeMounts:
            - name: postgres-storage
              mountPath: /var/lib/postgresql/data
          env:
            - name: POSTGRES_DB
              value: "danndb"
            - name: POSTGRES_PASSWORD
              value: "12345678"
      volumes:
        - name: postgres-storage
          persistentVolumeClaim:
            claimName: postgres-pvc
