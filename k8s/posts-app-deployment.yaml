# ConfigMap
apiVersion: v1
kind: ConfigMap
metadata:
  name: posts-app-config
data:
  SERVER_URL: "0.0.0.0"
  SERVER_PORT: "9000"
  # DB vars
  DB_USER: "postgres"
  DB_PASSWORD: "1234"
  DB_NAME: "posts-db"
  DB_PORT: "5432"

---
# App service
apiVersion: v1
kind: Service
metadata:
  name: posts-app-service
spec:
  type: NodePort
  selector:
    app: posts-app
  ports:
    - protocol: TCP
      port: 80
      targetPort: 9000
      nodePort: 30001

---
# App deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: posts-app-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: posts-app
  template:
    metadata:
      labels:
        app: posts-app
    spec:
      containers:
        - name: posts-app
          image: posts-app:1.0.0
          ports:
          - containerPort: 9000
          livenessProbe:
            httpGet:
              path: /ping
              port: 9000
            initialDelaySeconds: 5 
            periodSeconds: 30
            failureThreshold: 3
          env:
            - name: SERVER_URL
              valueFrom:
                configMapKeyRef:
                  name: posts-app-config
                  key: SERVER_URL
            - name: SERVER_PORT
              valueFrom:
                configMapKeyRef:
                  name: posts-app-config
                  key: SERVER_PORT
            - name: DB_USER
              valueFrom:
                configMapKeyRef:
                  name: posts-app-config
                  key: DB_USER
            - name: DB_PASSWORD
              valueFrom:
                configMapKeyRef:
                  name: posts-app-config
                  key: DB_PASSWORD
            - name: DB_NAME
              valueFrom:
                configMapKeyRef:
                  name: posts-app-config
                  key: DB_NAME
            - name: DB_PORT
              valueFrom:
                configMapKeyRef:
                  name: posts-app-config
                  key: DB_PORT
            - name: DEBUG
              value: "false"
            - name: DB_HOST
              value: "db-service"

