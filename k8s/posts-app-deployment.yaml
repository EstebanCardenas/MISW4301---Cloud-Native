# Secret
apiVersion: v1
kind: Secret
metadata:
  name: posts-app-secret
type: Opaque
stringData:
  DATABASE_URL: "postgresql://postgres:12345678@terraform-20250914002711507500000001.c1wwg4wiavc5.us-east-1.rds.amazonaws.com:5432/danndb"

---
# App service
apiVersion: v1
kind: Service
metadata:
  name: posts-app-service
spec:
  type: ClusterIP
  selector:
    app: posts-app
  ports:
    - protocol: TCP
      port: 80
      targetPort: 9000

---
# App deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: posts-app-deployment
  labels:
    app: posts-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: posts-app
  template:
    metadata:
      labels:
        app: posts-app
    spec:
      containers:
        - name: posts-app
          image: 381492016771.dkr.ecr.us-east-1.amazonaws.com/posts_app:2.0.0
          ports:
          - containerPort: 9000
          livenessProbe:
            httpGet:
              path: /posts/ping
              port: 9000
            initialDelaySeconds: 5 
            periodSeconds: 30
            failureThreshold: 3
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: posts-app-secret
                  key: DATABASE_URL

