# ConfigMap
apiVersion: v1
kind: ConfigMap
metadata:
  name: users-app-config
data:
  SERVER_URL: "0.0.0.0"
  SERVER_PORT: "3000"
  # DB vars
  DB_USER: "postgres"
  DB_PASSWORD: "1234" # TODO: Move to secrets
  DB_NAME: "users_db"
  DB_PORT: "5432"

---
# App service
apiVersion: v1
kind: Service
metadata:
  name: users-app-service
spec:
  type: NodePort
  selector:
    app: users-app
  ports:
    - protocol: TCP
      port: 80
      targetPort: 3000
      nodePort: 30000

---
# App deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: users-app-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: users-app
  template:
    metadata:
      labels:
        app: users-app
    spec:
      containers:
        - name: users-app
          image: users-app:1.0.0
          ports:
          - containerPort: 3000
          livenessProbe:
            httpGet:
              path: /ping
              port: 3000
            initialDelaySeconds: 5 
            periodSeconds: 30
            failureThreshold: 3
          env:
            - name: SERVER_URL
              valueFrom:
                configMapKeyRef:
                  name: users-app-config
                  key: SERVER_URL
            - name: SERVER_PORT
              valueFrom:
                configMapKeyRef:
                  name: users-app-config
                  key: SERVER_PORT
            - name: DB_USER
              valueFrom:
                configMapKeyRef:
                  name: users-app-config
                  key: DB_USER
            - name: DB_PASSWORD
              valueFrom:
                configMapKeyRef:
                  name: users-app-config
                  key: DB_PASSWORD
            - name: DB_NAME
              valueFrom:
                configMapKeyRef:
                  name: users-app-config
                  key: DB_NAME
            - name: DB_PORT
              valueFrom:
                configMapKeyRef:
                  name: users-app-config
                  key: DB_PORT
            - name: DEBUG
              value: "false"
            - name: DB_HOST
              value: "db-service"

---
# # DB service
apiVersion: v1
kind: Service
metadata:
  name: db-service
spec:
  type: ClusterIP
  selector:
    app: db
  ports:
    - protocol: TCP
      port: 5432
      targetPort: 5432

---
# DB deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: db-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: db
  template:
    metadata:
      labels:
        app: db
    spec:
      containers:
        - name: postgres-db
          image: postgres
          ports:
          - containerPort: 5432
          volumeMounts:
            - name: postgres-storage
              mountPath: /var/lib/postgresql/data
          env:
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: users-app-config
                  key: DB_NAME
            - name: POSTGRES_PASSWORD
              valueFrom:
                configMapKeyRef:
                  name: users-app-config
                  key: DB_PASSWORD
          livenessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - postgres
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 5
          readinessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - postgres
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
      volumes:
        - name: postgres-storage
          persistentVolumeClaim:
            claimName: users-db-volumen

---
# DB volume
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: users-db-volumen
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
