# ConfigMap
apiVersion: v1
kind: ConfigMap
metadata:
  name: offers-app-config
data:
  DB_USER: "postgres"
  DB_PASSWORD: "1234"
  DB_NAME: "offers_db"
  DB_URL: "postgresql+psycopg2://postgres:1234@offers-db-service:5432/offers_db"

---
# App service
apiVersion: v1
kind: Service
metadata:
  name: offers-app-service
spec:
  type: NodePort
  selector:
    app: offers-app
  ports:
    - protocol: TCP
      port: 80
      targetPort: 9000
      nodePort: 30003

---
# App deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: offers-app-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: offers-app
  template:
    metadata:
      labels:
        app: offers-app
    spec:
      containers:
        - name: offers-app
          image: offers-app:1.0.0
          ports:
          - containerPort: 9000
          livenessProbe:
            httpGet:
              path: /offers/ping
              port: 9000
            initialDelaySeconds: 5
            periodSeconds: 30
            failureThreshold: 5
          env:
            - name: DATABASE_URL
              valueFrom:
                configMapKeyRef:
                  name: offers-app-config
                  key: DB_URL

---
# DB service
apiVersion: v1
kind: Service
metadata:
  name: offers-db-service
spec:
  type: ClusterIP
  selector:
    app: offers-db
  ports:
    - protocol: TCP
      port: 5432
      targetPort: 5432

---
# DB deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: offers-db-deployment
  labels:
    app: offers-db
spec:
  replicas: 1
  selector:
    matchLabels:
      app: offers-db
  template:
    metadata:
      labels:
        app: offers-db
    spec:
      containers:
        - name: postgres-db
          image: postgres
          ports:
          - containerPort: 5432
          volumeMounts:
            - name: offers-db-volume
              mountPath: /var/lib/postgresql/data
          env:
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: offers-app-config
                  key: DB_NAME
            - name: POSTGRES_PASSWORD
              valueFrom:
                configMapKeyRef:
                  name: offers-app-config
                  key: DB_PASSWORD
            - name: POSTGRES_USER
              valueFrom:
                configMapKeyRef:
                  name: offers-app-config
                  key: DB_USER
          livenessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - postgres
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 5
          readinessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - postgres
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
      volumes:
        - name: offers-db-volume
          emptyDir:
            sizeLimit: 1Gi
---

apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: offers-network
spec:
  podSelector:
    matchLabels:
      app: offers-db
  policyTypes:
    - Ingress
  ingress:
    - from:
      - podSelector:
          matchLabels:
            app: offers-app
      ports:
        - protocol: TCP
          port: 5432

