version: "3.9"

services:
  offers_app:
    build:
      context: ./offers_app
      dockerfile: Dockerfile
    container_name: offers_app
    depends_on:
      - offers_db
    environment:
      DATABASE_URL: ${DATABASE_URL}
    ports:
      - "3001:9000"
    command: poetry run uvicorn src.main:app --host 0.0.0.0 --port 9000
    networks:
      - offers_network
    env_file:
      - .env

  offers_db:
    image: postgres:15
    container_name: offers_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5434:5432"
    volumes:
      - offers_db_data:/var/lib/postgresql/data
    networks:
      - offers_network
    env_file:
      - .env

networks:
  offers_network:

volumes:
  offers_db_data:
