[tool.poetry]
name = "routes-app"
version = "0.1.0"
description = "Routes app"
authors = ["DavidMS73 <gd.martinez@uniandes.edu.co>"]
package-mode = false
readme = "README.md"

[tool.poetry.dependencies]
python = ">=3.12"
annotated-types = "0.7.0"
anyio = "4.10.0"
certifi = "2025.8.3"
click = "8.2.1"
colorama = "0.4.6"
fastapi = "0.116.1"
greenlet = "3.2.4"
h11 = "0.16.0"
httpcore = "1.0.9"
httpx = "0.28.1"
idna = "3.10"
iniconfig = "2.1.0"
packaging = "25.0"
pluggy = "1.6.0"
psycopg2-binary = "2.9.10"
pydantic = "2.11.7"
pydantic-core = "2.33.2"
pygments = "2.19.2"
pytest = "8.4.1"
python-dotenv = "1.1.1"
sniffio = "1.3.1"
sqlalchemy = "2.0.42"
starlette = "0.47.2"
typing-inspection = "0.4.1"
typing-extensions = "4.14.1"
uvicorn = "0.35.0"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.group.dev.dependencies]
black = "~25.1.0"
ruff = "~0.11.12"
bandit = "~1.8.3"
flake8 = "~7.2.0"
isort = "~6.0.1"
pytest = "~8.4.0"
pytest-cov = "~6.1.1"
pytest-mock = "~3.14.1"
pytest-env = "~1.1.5"
faker = "~37.3.0"

[tool.isort]
# https://pycqa.github.io/isort/docs/configuration/black_compatibility/
profile = "black"
multi_line_output = 3

[tool.bandit]
# See https://bandit.readthedocs.io/en/latest/config.html for reference
exclude_dirs = ["./tests"]
skips = ["B101"]

[tool.pydoclint]
# See https://jsh9.github.io/pydoclint/how_to_config.html#2-specifying-options-in-a-configuration-file for config reference.
style = "google"
arg-type-hints-in-docstring = true
check-return-types = false
check-yield-types = false

[tool.ruff]
# Directories to consider “first party” imports
src = ["src"]
fix = true

[tool.ruff.lint.pydocstyle]
# See https://docs.astral.sh/ruff/settings/#pydocstyle for reference.
convention = "google"

[tool.ruff.lint.mccabe]
# See https://docs.astral.sh/ruff/settings/#mccabe for reference.
max-complexity = 20

[tool.pytest.ini_options]
# https://docs.pytest.org/en/7.2.x/reference/customize.html for reference
python_files = "test_*.py"
pythonpath = "src"
testpaths = [
  "tests"
]
env = [ # environment variables for testing
  "LOG_LEVEL = INFO"
]