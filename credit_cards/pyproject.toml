[project]
name = "offers-app"
version = "0.1.0"
description = ""
authors = [
    { name = "afDonosoD", email = "af.donoso@uniandes.edu.co" }
]
readme = "README.md"
requires-python = ">=3.12"

[tool.poetry]
packages = [{ include = "*", from = "src" }]
name = "offers-app"
version = "0.1.0"
description = ""
authors = ["Andres Donoso"]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.dependencies]
python = "~3.12"
dotenv = ">=0.9.9,<0.10.0"
sqlalchemy = ">=2.0.42,<3.0.0"
fastapi = ">=0.116.1,<0.117.0"
uvicorn = ">=0.35.0,<0.36.0"
pydantic = ">=2.11.7,<3.0.0"
pydantic-settings = ">=2.10.1,<3.0.0"
psycopg2-binary = ">=2.9.10,<3.0.0"
httpx = ">=0.28.1,<0.29.0"
python-dotenv = ">=1.0.1,<2.0.0"
requests = "^2.32.5"
boto3 = "^1.40.40"

[tool.poetry.group.dev.dependencies]
black = "~25.1.0"
ruff = "~0.11.12"
bandit = "~1.8.3"
flake8 = "~7.2.0"
isort = "~6.0.1"
pytest = "~8.4.0"
pytest-cov = "~6.1.1"
pytest-mock = "~3.14.1"
pytest-env = "~1.1.5"
faker = "~37.3.0"

[tool.isort]
profile = "black"
multi_line_output = 3

[tool.bandit]
exclude_dirs = ["./tests"]
skips = ["B101"]

[tool.pydoclint]
style = "google"
arg-type-hints-in-docstring = true
check-return-types = false
check-yield-types = false

[tool.ruff]
src = ["src"]
fix = true

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.mccabe]
max-complexity = 20

[tool.pytest.ini_options]
python_files = "test_*.py"
pythonpath = "src"
testpaths = ["tests"]
env = [
  "LOG_LEVEL = INFO"
]
