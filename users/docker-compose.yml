services:
  user_api:
    build:
      context: .
    environment:
      - DEBUG=false
      - DB_HOST=db
    env_file: ".env"
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    develop:
      watch:
        - action: rebuild
          path: ./cmd/
          target: /app/cmd/
        - action: rebuild
          path: ./internal/
          target: /app/internal/

  db:
    image: postgres
    restart: always
    user: postgres
    volumes:
      - db-data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=users_db
      - POSTGRES_PASSWORD=1234
    expose:
      - 5432
    healthcheck:
      test: [ "CMD", "pg_isready" ]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  db-data:
